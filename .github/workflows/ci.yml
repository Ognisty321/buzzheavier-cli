name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck buzzheavier.sh tests/run.sh
      - name: Tests (against the local mock API)
        run: bash tests/run.sh
